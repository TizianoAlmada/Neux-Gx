name: Build Nexus GX Installers (Windows & Linux)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build frontend and electron
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-gx-windows-installer
          path: dist-installers/*.exe

  build-linux:
    name: Build Linux (.deb, .AppImage, .rpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system build dependencies for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build frontend and electron
        run: npm run build

      - name: Build Linux packages (.deb, .AppImage, .rpm)
        run: npx electron-builder --linux deb AppImage rpm --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-gx-linux-packages
          path: |
            dist-installers/*.deb
            dist-installers/*.AppImage
            dist-installers/*.rpm
