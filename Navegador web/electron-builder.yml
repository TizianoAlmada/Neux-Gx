appId: com.nexusgx.browser
productName: Nexus GX
copyright: "Copyright © 2026 Nexus GX Team"

directories:
  output: dist-installers
  buildResources: build

files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json

extraMetadata:
  main: dist-electron/main/index.js

protocols:
  - name: Nexus GX Web Protocol
    schemes:
      - http
      - https
      - nexus

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  legalTrademarks: Nexus GX

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nexus GX
  uninstallDisplayName: Nexus GX Browser
  runAfterFinish: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: build/icon.png
  category: Network;WebBrowser;
  mimeTypes:
    - text/html
    - text/xml
    - application/xhtml+xml
    - x-scheme-handler/http
    - x-scheme-handler/https
    - x-scheme-handler/nexus
  desktop:
    Name: Nexus GX
    Comment: Futuristic Chromium-based Gamer Web Browser
    Categories: Network;WebBrowser;
    Terminal: false
    StartupWMClass: nexus-gx
